<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ece6d8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece6d8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ece6d8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ece6d8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="4" y="4" width="1192" height="462" rx="24"/>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="4" y="4" width="1192" height="462" rx="24" fill="#0b0a09" stroke="#ece6d8" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="462" rx="24" fill="url(#grid)"/>

  <!-- scanline sweep -->
  <g clip-path="url(#screen)">
    <rect x="4" width="1192" height="52" fill="url(#sweep)">
      <animate attributeName="y" from="-70" to="480" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title bar -->
  <circle cx="64" cy="64" r="10" fill="#c1301c"/>
  <circle cx="96" cy="64" r="10" fill="#ece6d8" fill-opacity="0.35"/>
  <circle cx="128" cy="64" r="10" fill="#8b8474"/>
  <text x="164" y="72" font-size="21" fill="#8b8474">prabin@void — zsh</text>

  <!-- REC light -->
  <circle cx="1052" cy="64" r="9" fill="#c1301c">
    <animate attributeName="opacity" values="1;1;0.15;0.15" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1072" y="72" font-size="21" fill="#8b8474">REC · VOL. I</text>

  <!-- vermilion seal -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
    <rect x="1088" y="104" width="64" height="64" rx="8" fill="#c1301c"/>
    <text x="1120" y="150" font-size="36" fill="#ece6d8" text-anchor="middle" font-family="serif">迷</text>
  </g>

  <!-- ghost watermark -->
  <text x="1150" y="430" font-size="210" font-weight="900" fill="#ece6d8" fill-opacity="0.05" text-anchor="end" font-family="Anton, Impact, sans-serif">PW</text>

  <!-- typed session -->
  <g font-size="27">
    <text x="64" y="152" fill="#ece6d8" opacity="0">$ whoami
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="64" y="198" fill="#8b8474" opacity="0">&gt; prabin wagle — computer engineering · nepal
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="64" y="254" fill="#ece6d8" opacity="0">$ stack --prod
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    </text>
    <text x="64" y="300" fill="#8b8474" opacity="0">&gt; react · typescript · three.js · gsap · tailwind · cloudflare
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.6s" fill="freeze"/>
    </text>
    <text x="64" y="356" fill="#ece6d8" opacity="0">$ status
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
    </text>
    <text x="220" y="356" fill="#c1301c" opacity="0">&gt; open to work
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4s" fill="freeze"/>
    </text>
    <text x="64" y="412" fill="#ece6d8" opacity="0">$ role
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.6s" fill="freeze"/>
    </text>
  </g>

  <!-- rotating roles -->
  <g font-size="27" fill="#ece6d8">
    <text x="220" y="412" opacity="0">&gt; ai engineer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.63;0.67;1" dur="6s" begin="5.2s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="412" opacity="0">&gt; creative developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.63;0.67;1" dur="6s" begin="7.2s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="412" opacity="0">&gt; void caretaker
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.63;0.67;1" dur="6s" begin="9.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s" fill="freeze"/>
    <rect x="480" y="386" width="17" height="32" fill="#c1301c">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
