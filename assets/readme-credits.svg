<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
  <defs>
    <clipPath id="stage">
      <rect x="4" y="4" width="1192" height="532" rx="24"/>
    </clipPath>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a09"/>
      <stop offset="1" stop-color="#0b0a09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a09" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="1192" height="532" rx="24" fill="#0b0a09" stroke="#ece6d8" stroke-opacity="0.14" stroke-width="2"/>

  <g clip-path="url(#stage)" text-anchor="middle">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -1560" dur="26s" repeatCount="indefinite"/>
    <g font-family="'IBM Plex Mono', ui-monospace, monospace">
      <text x="600" y="600" font-size="26" fill="#8b8474" letter-spacing="8">A PORTFOLIO IN THREE ACTS*</text>
      <text x="600" y="700" font-size="84" font-weight="900" fill="#ece6d8" font-family="Anton, Impact, sans-serif">PRABIN WAGLE</text>
      <text x="600" y="748" font-size="30" font-style="italic" fill="#8b8474" font-family="Georgia, serif">in</text>
      <text x="600" y="812" font-size="30" fill="#c1301c" letter-spacing="6">COMPUTATIONAL INK — VOL. I</text>
      <text x="600" y="920" font-size="22" fill="#8b8474" letter-spacing="8">STARRING</text>
      <text x="600" y="978" font-size="44" font-weight="900" fill="#ece6d8" font-family="Anton, Impact, sans-serif">THE INK SCULPTURE</text>
      <text x="600" y="1012" font-size="21" fill="#8b8474">as itself</text>
      <text x="600" y="1076" font-size="44" font-weight="900" fill="#ece6d8" font-family="Anton, Impact, sans-serif">THE LOST DIGITS</text>
      <text x="600" y="1110" font-size="21" fill="#8b8474">as the void</text>
      <text x="600" y="1218" font-size="22" fill="#8b8474" letter-spacing="8">ALSO FEATURING</text>
      <text x="600" y="1272" font-size="26" fill="#ece6d8">GSAP · LENIS · THREE.JS · FRAMER · ANIME.JS</text>
      <text x="600" y="1312" font-size="21" fill="#8b8474">choreography · glide · haunted dimension · curtains · chaos</text>
      <text x="600" y="1420" font-size="22" fill="#8b8474" letter-spacing="8">SHOT ON LOCATION AT</text>
      <text x="600" y="1474" font-size="26" fill="#ece6d8">CLOUDFLARE · NEPAL · 27.71° N, 85.32° E</text>
      <text x="600" y="1582" font-size="24" fill="#c1301c" letter-spacing="4">*THIRD ACT TAKES PLACE IN THE 404 VOID</text>
      <text x="600" y="1640" font-size="22" fill="#8b8474" letter-spacing="6">NO 404s WERE HARMED</text>
    </g>
  </g>

  <rect x="4" y="4" width="1192" height="120" fill="url(#fadeTop)"/>
  <rect x="4" y="416" width="1192" height="120" fill="url(#fadeBot)"/>
</svg>
